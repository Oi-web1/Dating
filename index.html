<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bgwords" id="bgwords" aria-hidden="true"></div>
<div class="beam" aria-hidden="true"></div>
<main>
  <div id="me"></div>
  <h3 class="sec hidden" id="membersTitle">আমাদের মেম্বার</h3>
  <div class="grid" id="members"></div>
</main>
<script src="data.js"></script>
<script>
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(u){return /^(https?:|mailto:|tel:)/i.test(u)?u:""}
function cardHTML(p,small){
  const photo = p.photo
    ? `<img class="photo" src="${esc(p.photo)}" alt="${esc(p.name||'ছবি')}">`
    : `<div class="ph" aria-hidden="true">👤</div>`;
  const c=safeUrl(p.contact||""), ch=safeUrl(p.chat||"");
  return `<article class="card${small?' small':''}"><div class="inner">${photo}
    <div class="info">
      ${p.name?`<h2>${esc(p.name)}</h2>`:''}
      ${p.age?`<div class="age">বয়স ${esc(p.age)}</div>`:''}
      ${p.about?`<p>${esc(p.about)}</p>`:''}
      <div class="actions">
        ${c?`<a class="btn" href="${esc(c)}" target="_blank" rel="noopener">Contact</a>`:''}
        ${ch?`<a class="btn alt" href="${esc(ch)}" target="_blank" rel="noopener">Chat</a>`:''}
      </div>
    </div></div></article>`;
}
if(SITE.title) document.title=SITE.title;
document.getElementById('bgwords').innerHTML=SITE.backgroundWords.filter(Boolean).map(w=>`<span>${esc(w)}</span>`).join('');
document.getElementById('me').innerHTML=cardHTML(ME,false);
const list=MEMBERS.filter(m=>m.name||m.photo||m.about);
if(list.length){
  document.getElementById('membersTitle').classList.remove('hidden');
  document.getElementById('members').innerHTML=list.map(m=>cardHTML(m,true)).join('');
}
</script>
</body>
</html>
