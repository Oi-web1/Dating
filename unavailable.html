<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not available</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{
  min-height:100vh;display:grid;place-items:center;padding:20px;color:#fff;
  font-family:"Inter",system-ui,sans-serif;
  background:radial-gradient(circle at 50% -10%,#5a1645 0%,#24091c 45%,#0b050a 100%);
}
.box{
  max-width:420px;width:100%;text-align:center;padding:32px 24px;border-radius:22px;
  background:#1d0b17;border:1px solid #ff4fa366;box-shadow:0 0 30px #ff4fa338;
}
h1{font-size:20px;font-weight:600;line-height:1.5}
p{margin-top:24px}
a{display:inline-block;margin-top:24px;padding:10px 22px;border-radius:999px;
  background:linear-gradient(90deg,#ff4fa3,#ff7cc0);color:#fff;font-weight:600;text-decoration:none}
a:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div class="box">
  <h1>I am not available right now.<br>Please try again later.</h1>
  <a href="index.html">Go Back</a>
</div>
</body>
